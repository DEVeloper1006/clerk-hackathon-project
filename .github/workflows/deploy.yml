name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Deploy hooks come from each Render service's Settings → Deploy Hook.
      - name: Trigger Render deploys
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          HOOK_AGENTS: ${{ secrets.RENDER_DEPLOY_HOOK_AGENTS }}
        run: |
          for hook in "$HOOK_API" "$HOOK_WEB" "$HOOK_AGENTS"; do
            if [ -z "$hook" ]; then
              echo "::warning::A Render deploy hook secret is not set; skipping"
              continue
            fi
            curl -fsS -X POST "$hook" > /dev/null
          done
