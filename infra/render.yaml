# Render Blueprint — https://render.com/docs/blueprint-spec
# Point Render at this file (Blueprint path: infra/render.yaml).
services:
  - type: web
    name: clerk-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: clerk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: clerk-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false

  - type: worker
    name: clerk-agents
    runtime: docker
    dockerfilePath: ./infra/docker/agents.Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clerk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: clerk-redis
          property: connectionString
      - key: ELASTICSEARCH_URL
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false

  - type: web
    name: clerk-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @clerk/web build
    staticPublishPath: ./packages/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: redis
    name: clerk-redis
    plan: starter
    ipAllowList: []

databases:
  - name: clerk-db
    databaseName: clerk
    user: clerk
    plan: basic-256mb
